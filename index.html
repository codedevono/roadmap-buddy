<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101a22">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<title>Roadmap Buddy</title>
<style>
:root{--bg:#eef2f4;--ink:#14202b;--mute:#5d6f7c;--line:#cfd9df;--accent:#1f6f78;--accent-ink:#fff;--track:#d9e3e8;--card:#f8fafb;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101a22;--ink:#e6edf1;--mute:#8fa2b0;--line:#2a3b49;--accent:#7cc4cc;--accent-ink:#0b1318;--track:#223240;--card:#15212b;color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
main{max-width:30rem;margin:0 auto;padding:1rem 1.25rem 2rem;display:flex;flex-direction:column;min-height:100%}
.top{display:flex;justify-content:space-between;align-items:baseline;color:var(--mute);font-size:.9rem}
.muted{color:var(--mute)}
.bar{height:.55rem;border-radius:1rem;background:var(--track);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:1rem;transition:width .6s ease}
.hud{margin:.6rem 0 .2rem}
.hl{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:.35rem}
.hl b{font-weight:650}
.hl span{color:var(--mute);font-size:.85rem;font-variant-numeric:tabular-nums}
.tabs{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:.25rem;margin:.9rem 0 .4rem}
@media (max-width:30rem){.tabs{grid-template-columns:repeat(3,minmax(0,1fr));gap:.35rem}}
.tabs button{min-height:2.75rem;font-size:.76rem;padding:.8rem .1rem;border-radius:.8rem;color:var(--mute);white-space:nowrap;overflow:hidden}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
#v-today{flex:1;display:flex;flex-direction:column}
.focus{flex:1;display:flex;flex-direction:column;justify-content:center;padding:1.5rem 0}
.track{color:var(--accent);font-weight:600;margin:0 0 .5rem}
h1{font:600 1.9rem/1.2 Georgia,"Iowan Old Style","Times New Roman",serif;margin:0 0 .75rem}
h2{font-size:.95rem;font-weight:600;margin:0 0 .6rem}
.hint{color:var(--mute);margin:0 0 1.5rem}
.ring{position:relative;width:11rem;height:11rem;margin:0 auto 1.5rem}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:10}
.ring .bg{stroke:var(--track)}
.ring .fg{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset 1s linear}
.ring .t{position:absolute;inset:0;display:grid;place-items:center;font:600 2rem system-ui,sans-serif;font-variant-numeric:tabular-nums}
button{font:inherit;color:var(--ink);background:transparent;border:1.5px solid var(--line);border-radius:.9rem;padding:.8rem 1rem;min-height:3rem;cursor:pointer}
button:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button.main{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600;width:100%;font-size:1.1rem;min-height:3.4rem}
button small{display:block;font-size:.75rem;color:var(--mute)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;margin-top:.75rem}
.why{color:var(--mute);font-size:.9rem;margin:-.9rem 0 1.25rem}
.proj,.week{border-top:1px solid var(--line);padding:1rem 0;margin-top:.5rem}
.p-row{display:flex;justify-content:space-between;gap:1rem;padding:.2rem 0;font-size:.95rem}
.p-row span:last-child{color:var(--mute)}
.t-row{display:flex;align-items:center;gap:.75rem;padding:.25rem 0}
.t-row .n{width:6.5rem;font-size:.95rem}
.dots{display:flex;gap:.3rem}
.dot{width:.8rem;height:.8rem;border-radius:50%;border:1.5px solid var(--line)}
.dot.on{background:var(--accent);border-color:var(--accent)}
.foot{display:flex;gap:.5rem;margin-top:1.25rem}
.foot button{flex:1;font-size:.85rem;min-height:2.5rem;color:var(--mute)}
.msg{color:var(--mute);text-align:center;padding:1rem}
/* roadmap */
.jour{background:var(--card);border:1px solid var(--line);border-radius:1rem;padding:1rem;margin:.4rem 0 .8rem}
.jour p{margin:.1rem 0 .6rem}
details.lad{border:1px solid var(--line);border-radius:1rem;margin:.5rem 0;background:var(--card)}
details.lad summary{list-style:none;cursor:pointer;padding:.8rem 1rem;display:grid;grid-template-columns:1fr auto;gap:.3rem .75rem;align-items:center;min-height:3rem}
details.lad summary::-webkit-details-marker{display:none}
details.lad summary .bar{grid-column:1/3}
.ln{font-weight:600}
.lc{color:var(--mute);font-size:.85rem;font-variant-numeric:tabular-nums}
.tp{display:grid;grid-template-columns:1.4rem 1fr;gap:.2rem .5rem;padding:.65rem 1rem;border-top:1px solid var(--line)}
.tp .ic{color:var(--mute);text-align:center}
.tp.done .ic,.tp.ready .ic{color:var(--accent);font-weight:700}
.tp.done .tt{color:var(--mute);text-decoration:line-through}
.tp.locked{opacity:.75}
.tt{font-size:.95rem}
.sub{font-size:.8rem;color:var(--mute)}
.acts{display:flex;gap:.4rem;margin-top:.4rem}
.mini{min-height:2.75rem;padding:.3rem .8rem;font-size:.85rem;border-radius:.7rem}
.mini.go{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
/* rewards */
.card{background:var(--card);border:1px solid var(--line);border-radius:1rem;padding:1rem;margin:.5rem 0}
.big{font:600 2.2rem/1.1 Georgia,"Times New Roman",serif}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;text-align:center}
.stats b{display:block;font-size:1.4rem;font-variant-numeric:tabular-nums}
.stats span{font-size:.8rem;color:var(--mute)}
.badges{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:.5rem}
.badges li{border:1.5px solid var(--line);border-radius:.9rem;padding:.7rem .8rem;font-size:.9rem;background:var(--card)}
.badges li b{display:block;font-size:.92rem}
.badges li span{color:var(--mute);font-size:.78rem}
.badges li.on{border-color:var(--accent)}
.badges li.on b::before{content:"\2713  ";color:var(--accent)}
.badges li.off{opacity:.65}
#toast{position:fixed;left:50%;bottom:calc(1rem + env(safe-area-inset-bottom,0px));transform:translate(-50%,2rem);max-width:min(26rem,92vw);background:var(--ink);color:var(--bg);padding:.8rem 1.1rem;border-radius:.9rem;font-size:.92rem;opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
/* path */
:root{--c-sys:#2a6db5;--c-gfx:#a86a00;--c-sec:#b83a2c;--c-ai:#8a3fa8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--c-sys:#86b8ea;--c-gfx:#e6b95f;--c-sec:#f2958a;--c-ai:#cfa3e6}}
.chip{display:inline-block;font-size:.72rem;font-weight:600;padding:.05rem .45rem;border-radius:.6rem;border:1px solid currentColor;margin-right:.4rem;vertical-align:1px}
.c-sys{color:var(--c-sys)}.c-gfx{color:var(--c-gfx)}.c-sec{color:var(--c-sec)}.c-ai{color:var(--c-ai)}
.tracks{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;margin:.5rem 0}
.tk{border:1px solid var(--line);border-left-width:4px;border-radius:.9rem;padding:.65rem .75rem;background:var(--card);display:flex;flex-direction:column;gap:.25rem}
.tk b{font-size:.95rem}
.tk span{font-size:.78rem}
.t-sys{border-left-color:var(--c-sys)}.t-gfx{border-left-color:var(--c-gfx)}.t-sec{border-left-color:var(--c-sec)}.t-ai{border-left-color:var(--c-ai)}
.core{text-align:center;font-weight:600;border:1.5px dashed var(--accent);border-radius:.9rem;padding:.7rem;margin:.1rem 0 .9rem;font-size:.92rem}
.stb{margin:.1rem 1rem .6rem;font-size:.88rem}
.sec-h{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);padding:.6rem 1rem .2rem;border-top:1px solid var(--line)}
.tp.ms .ic{color:var(--mute)}
.tp.ms.done .ic{color:var(--accent);font-weight:700}
.cal .p-row{padding:.5rem 1rem;border-top:1px solid var(--line)}
.note{font-size:.82rem;margin:.5rem .2rem}
.card{border:1.5px solid var(--line);border-radius:1rem;padding:1rem;margin:.75rem 0}
.card h3{margin:0 0 .3rem;font-size:1.05rem}
.sub{color:var(--mute);font-size:.9rem;margin:.2rem 0}
.prow{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:.75rem}
.prow button{flex:1;min-width:5.5rem;min-height:2.6rem;font-size:.9rem}
.pills{display:flex;flex-wrap:wrap;gap:.4rem;margin:.4rem 0}
.pill{min-height:2.2rem;padding:.3rem .7rem;font-size:.85rem;border-radius:999px}
.pill.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
#v-projects label{display:block;margin:.6rem 0;font-size:.9rem;color:var(--mute)}
#v-projects input,#v-projects select,#v-projects textarea{display:block;width:100%;font:inherit;color:var(--ink);background:transparent;border:1.5px solid var(--line);border-radius:.7rem;padding:.6rem .7rem;margin-top:.25rem}
#v-projects button.main{margin-top:.75rem}
/* calendar */
.k-deadline{color:var(--accent)}.k-milestone,.k-personal{color:var(--mute)}.k-hackathon{color:var(--c-gfx)}.k-ctf{color:var(--c-sec)}.k-contest{color:var(--c-ai)}.k-gsoc,.k-internship{color:var(--c-sys)}
.calh{display:grid;grid-template-columns:auto 1fr auto auto;gap:.35rem;align-items:center;margin:.4rem 0 .6rem}
.calh h2{margin:0;text-align:center;font-size:.95rem}
.calh .mini{min-width:2.75rem}
.cal-g{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
.cal-w{text-align:center;font-size:.7rem;color:var(--mute);padding:.2rem 0}
.cd{min-height:2.9rem;padding:.2rem 0;border-radius:.6rem;border:1.5px solid transparent;display:flex;flex-direction:column;align-items:center;gap:.15rem;background:transparent}
.cd[aria-pressed="true"]{border-color:var(--accent);background:var(--card)}
.cd .dn{display:grid;place-items:center;width:1.6rem;height:1.6rem;border-radius:50%;font-size:.85rem;font-variant-numeric:tabular-nums}
.cd.today .dn{background:var(--accent);color:var(--accent-ink);font-weight:600}
.kds{display:flex;gap:2px;min-height:.4rem}
.kd{width:.4rem;height:.4rem;border-radius:50%;background:currentColor;display:block}
.legend{margin:.6rem 0 0}
.ev{border-top:1px solid var(--line);padding:.7rem 0}
.ev .tt{font-size:.95rem}
.ev .acts{flex-wrap:wrap}
details.evn{margin-top:.2rem;font-size:.82rem;color:var(--mute)}
details.evn summary{cursor:pointer;min-height:1.6rem}
#v-calendar label{display:block;margin:.6rem 0;font-size:.9rem;color:var(--mute)}
#v-calendar input,#v-calendar select,#v-calendar textarea{display:block;width:100%;font:inherit;color:var(--ink);background:transparent;border:1.5px solid var(--line);border-radius:.7rem;padding:.6rem .7rem;margin-top:.25rem}
#v-calendar button.main{margin-top:.75rem}
@media (prefers-reduced-motion:reduce){.ring .fg,.bar i,#toast{transition:none}}
</style>
</head>
<body>
<main>
  <div class="top"><span id="date"></span><span id="count"></span></div>
  <section class="hud" aria-label="Level and XP">
    <div class="hl"><b id="lv"></b><span id="xp"></span></div>
    <div class="bar"><i id="xpb" style="width:0"></i></div>
  </section>
  <nav class="tabs" role="tablist" aria-label="Views">
    <button role="tab" data-v="today" aria-selected="true">Today</button>
    <button role="tab" data-v="projects" aria-selected="false">Projects</button>
    <button role="tab" data-v="calendar" aria-selected="false">Calendar</button>
    <button role="tab" data-v="path" aria-selected="false">Path</button>
    <button role="tab" data-v="roadmap" aria-selected="false">Topics</button>
    <button role="tab" data-v="rewards" aria-selected="false">Rewards</button>
  </nav>

  <div id="v-today" role="tabpanel">
    <section class="focus" id="focus" aria-live="polite"></section>
    <section class="proj"><h2>Projects</h2><div id="proj"></div></section>
    <section class="week"><h2>This week</h2><div id="week"></div>
      <div class="foot"><button id="copy">Copy dev log</button><button id="reset">Reset data</button></div>
    </section>
  </div>
  <div id="v-projects" role="tabpanel" hidden></div>
  <div id="v-calendar" role="tabpanel" hidden></div>
  <div id="v-path" role="tabpanel" hidden></div>
  <div id="v-roadmap" role="tabpanel" hidden></div>
  <div id="v-rewards" role="tabpanel" hidden></div>
</main>
<div id="toast" role="status" aria-live="polite"></div>
<script>
const KEY='buddy.v2', DAY=864e5, FILES=['skills.json','projects.json','events.json'];
const GOAL=4;                                   // sessions per week that count as a goal week
const XP={session:10,tiny:5,topic:40};
const TITLES=['Newcomer','Apprentice','Builder','Maker','Engineer','Architect','Master'];
let D=null, P=null, S=load(), cur=null, timer=null, idx={}, msIdx={}, view='today', openL=new Set(), openS=null, toastT=null;

function blank(){return{done:{},later:{},last:{},log:[],pin:null,badges:{},lvl:1,ms:{},projects:[],focus:null,events:[],evDate:{}}}
function load(){try{return Object.assign(blank(),JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){return blank()}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const $=id=>document.getElementById(id);
function el(t,c,x){const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function bar(f){const b=el('div','bar'),i=el('i');i.style.width=Math.round(Math.max(0,Math.min(1,f))*100)+'%';b.append(i);return b}
const isDone=id=>!!S.done[id];
const ready=n=>(n.needs||[]).every(isDone);
function build(){idx={};for(const l of D.ladders)for(const n of l.nodes){n.lad=l;idx[n.id]=n}
  msIdx={};if(P)for(const m of P.milestones)msIdx[m.id]=m}

/* ---------- weeks ---------- */
function wkStart(ts){const d=new Date(ts);d.setHours(0,0,0,0);d.setDate(d.getDate()-(d.getDay()+6)%7);return d.getTime()}
const weekStart=()=>wkStart(Date.now());
function prevWeek(w){const d=new Date(w);d.setDate(d.getDate()-7);return d.getTime()}
function weekCount(lid){const w=weekStart();return S.log.filter(l=>l.lad===lid&&l.ts>=w).length}
function closure(id,seen=new Set()){if(seen.has(id)||!idx[id])return seen;seen.add(id);(idx[id].needs||[]).forEach(p=>closure(p,seen));return seen}
function firstOpen(lad){return lad.nodes.find(n=>!isDone(n.id)&&ready(n)&&!(S.later[n.id]>Date.now()))}

/* ---------- gamification (all derived from the log, nothing extra to lose) ---------- */
function stats(){
  let xp=0,tiny=0,topics=0;const lads=new Set(),weeks={};
  for(const l of S.log){
    xp+=l.k==='topic'?XP.topic:l.k==='tiny'?XP.tiny:XP.session;
    if(l.k==='topic')topics++;
    if(l.k==='tiny')tiny++;
    lads.add(l.lad);
    const w=wkStart(l.ts);weeks[w]=(weeks[w]||0)+1;
  }
  let msDone=0;for(const id in S.ms){if(msIdx[id]){xp+=msIdx[id].xp;msDone++}}   // milestone XP is derived too
  const lvl=Math.floor(Math.sqrt(xp/50))+1, base=50*(lvl-1)**2, next=50*lvl**2;
  let w=weekStart(),streak=0;
  if((weeks[w]||0)>=GOAL)streak=1;           // this week counts once reached; missing it so far breaks nothing
  w=prevWeek(w);
  while((weeks[w]||0)>=GOAL){streak++;w=prevWeek(w)}
  return{xp,lvl,base,next,frac:(xp-base)/(next-base),sess:S.log.length,tiny,topics,msDone,ladsUsed:lads.size,
    goalWeeks:Object.values(weeks).filter(v=>v>=GOAL).length,streak,thisWeek:weeks[weekStart()]||0};
}
const title=l=>TITLES[Math.min(l-1,TITLES.length-1)];
function allBadges(){
  const B=[
    {id:'first',n:'First step',d:'Log your first session',f:s=>s.sess>=1},
    {id:'tiny',n:'Small start counts',d:'Finish a 5-minute tiny step',f:s=>s.tiny>=1},
    {id:'s10',n:'Ten sessions',d:'Log 10 sessions',f:s=>s.sess>=10},
    {id:'s50',n:'Fifty sessions',d:'Log 50 sessions',f:s=>s.sess>=50},
    {id:'t1',n:'Topic cleared',d:'Finish a topic',f:s=>s.topics>=1},
    {id:'t10',n:'Ten topics',d:'Finish 10 topics',f:s=>s.topics>=10},
    {id:'t25',n:'Twenty-five topics',d:'Finish 25 topics',f:s=>s.topics>=25},
    {id:'wk1',n:'Goal week',d:'Log '+GOAL+' sessions in one week',f:s=>s.goalWeeks>=1},
    {id:'wk4',n:'Four in a row',d:'Hit the weekly goal 4 weeks running',f:s=>s.streak>=4},
    {id:'explore',n:'Explorer',d:'Log sessions in 5 different ladders',f:s=>s.ladsUsed>=5}
  ];
  for(const l of D.ladders)B.push({id:'mast-'+l.id,n:l.name+' mastered',d:'Finish every topic in '+l.name,f:()=>l.nodes.every(n=>isDone(n.id))});
  if(P){
    B.push({id:'ms1',n:'First milestone',d:'Claim a milestone on the Path',f:s=>s.msDone>=1});
    B.push({id:'ms10',n:'Ten milestones',d:'Claim 10 milestones',f:s=>s.msDone>=10});
    B.push({id:'conv',n:'Converger',d:'Finish a quest in all four tracks',f:()=>P.tracks.every(t=>P.stages.some(s=>s.topics.some(x=>x.tr===t.id&&isDone(x.id))))});
    for(const s of P.stages)B.push({id:'stage-'+s.id,n:s.name+' cleared',d:'Finish every quest in '+s.name,f:()=>s.topics.every(t=>isDone(t.id))});
    for(const m of P.milestones)if(m.boss){const sg=P.stages.find(x=>x.id===m.stage);B.push({id:'boss-'+m.id,n:'Boss beaten: '+(sg?sg.name:m.stage),d:m.t.replace(/^Boss: /,''),f:()=>!!S.ms[m.id]})}
  }
  return B;
}
// Awards new badges and level-ups. silent=true on first load so old progress does not pop toasts.
function check(silent){
  const st=stats(),msgs=[];let changed=false;
  const fresh=allBadges().filter(b=>b.f(st)&&!S.badges[b.id]);
  for(const b of fresh){S.badges[b.id]=Date.now();changed=true}
  if(st.lvl>S.lvl){if(!silent)msgs.push('Level up! Level '+st.lvl+', '+title(st.lvl));S.lvl=st.lvl;changed=true}
  if(!silent&&fresh.length)msgs.push('Badge: '+fresh.map(b=>b.n).join(', '));
  if(changed)save();
  if(msgs.length)toast(msgs.join('  ·  '));
}
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),4000)}

/* ---------- planner ---------- */
// Sums three pressures per task: project need, event deadline, ladder floor (nothing starves).
function pick(){
  const now=Date.now(), sc={}, why={};
  if(S.pin&&idx[S.pin]&&!isDone(S.pin)&&ready(idx[S.pin])){const n=idx[S.pin];return{n,lad:n.lad,why:'You chose this from the roadmap'}}
  const add=(id,s,w)=>{sc[id]=(sc[id]||0)+s;(why[id]=why[id]||[]).push([s,w])};
  const fp=focusP();
  for(const p of D.projects){
    if(p.status==='paused')continue;
    const f=fp?(fp.id===p.id?1:.25):1, best={};
    p.needs.forEach((nid,i)=>{
      if(isDone(nid))return;
      const base=p.priority*p.priority*Math.max(10-i,2);
      for(const c of closure(nid)){
        if(isDone(c)||!ready(idx[c]))continue;
        const s=c===nid?base:base*.9;
        if(!best[c]||best[c].s<s)best[c]={s,w:c===nid?p.name+' needs this':p.name+' needs '+short(idx[nid]).toLowerCase()+', and this comes first'};
      }
    });
    for(const c in best)add(c,best[c].s*f,best[c].w);
  }
  for(const p of S.projects){   // tasks of projects made in the app
    if(p.status==='paused')continue;
    const f=fp?(fp.id===p.id?1:.25):1, t=ptNodes(p).find(n=>!isDone(n.id)&&!(S.later[n.id]>now));
    if(!t)continue;
    const dl=daysTo(p.deadline);
    add(t.id,p.priority*p.priority*12*f+(dl!=null?Math.max(0,20-dl)*.5*f:0),p.name+(fp&&fp.id===p.id?' is your focus project':' is one of your projects')+(dl!=null?(dl>=0?', due in '+dl+' days':', past its date'):''));
  }
  for(const e of D.events){
    const ed=evDate(e);if(!ed)continue;
    const days=Math.max((new Date(ed)-now)/DAY,3);
    if(days>180)continue;
    const u=e.weight*300/days;
    for(const t of e.prep){
      const ids=idx[t]?[t]:[(D.ladders.find(l=>l.id===t)||{nodes:[]}).nodes.find(n=>!isDone(n.id)&&ready(n))?.id].filter(Boolean);
      for(const nid of ids)for(const c of closure(nid))if(!isDone(c)&&ready(idx[c]))add(c,u,e.name+' in '+Math.round(days)+' days');
    }
  }
  for(const l of D.ladders){
    const n=firstOpen(l);if(!n)continue;
    const gap=Math.max(0,(l.floor-weekCount(l.id))/l.floor);
    const idle=Math.min((now-(S.last[l.id]||0))/DAY,7);
    add(n.id,gap*6+idle*.4,'keeps '+l.name+' moving this week');
  }
  let best=null;
  for(const id in sc){
    if(S.later[id]>now)continue;
    if(!best||sc[id]>best.s)best={id,s:sc[id]};

  if(!best)return null;
  const n=idx[best.id]||PT[best.id], reasons=why[best.id].sort((a,b)=>b[0]-a[0]).slice(0,2).map(r=>r[1]);
  return {n,lad:n.lad,why:reasons.join('; ')};
}

const EV_USER=Object.keys(EVT).filter(k=>k!=='deadline');
const ISO=/^\d{4}-\d{2}-\d{2}$/;
const pad2=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
const fmt=(s,o)=>new Date(s+'T00:00:00').toLocaleDateString(undefined,o||{day:'numeric',month:'short',year:'numeric'});
let calV=(()=>{const n=new Date();return{y:n.getFullYear(),m:n.getMonth()}})(), selDay=ymd(new Date()), ef=null, dEdit=null;
function evDate(e){return S.evDate[e.id]||e.date||''}
const endOf=it=>it.end&&it.end>=it.date?it.end:it.date;
const onDay=(items,ds)=>items.filter(it=>it.date&&it.date<=ds&&ds<=endOf(it));
function calItems(){
  const out=[];
  for(const p of allProjects())if(p.deadline)out.push({k:'deadline',name:p.name+' due',date:p.deadline,pid:p.id,paused:p.status==='paused'});
  for(const e of D.events){const mine=!!S.evDate[e.id];out.push({k:EVT[e.type]?e.type:'personal',name:e.name,date:evDate(e),fid:e.id,note:e.note,est:!!e.est&&!mine,mine,base:e.date||''})}
  for(const e of S.events)out.push({k:EVT[e.type]?e.type:'personal',name:e.name,date:e.date,end:e.end||'',uid:e.id,note:e.note});
  return out;
}
function when(it){
  const a=it.date,b=endOf(it),dl=daysTo(a),de=daysTo(b);
  let t=a===b?fmt(a):fmt(a,{day:'numeric',month:'short'})+' to '+fmt(b);
  if(de<0)return t+' · earlier';
  if(dl>1)return t+' · in '+dl+' days';
  if(dl===1)return t+' · tomorrow';
  return t+(a===b?' · today':' · on now');
}
function refreshToday(){if(!timer)render()}
function calRow(it){
  const r=el('div','ev'),h=el('div','tt');
  h.append(el('span','chip k-'+it.k,EVT[it.k]),document.createTextNode(it.name+(it.paused?' (paused)':'')));
  r.append(h);
  r.append(el('div','sub',it.date?when(it)+(it.est?' · estimated':'')+(it.mine?' · your date':''):'No date yet'));
  if(it.note){const d=el('details','evn');d.append(el('summary',null,'Note'),el('div',null,it.note));r.append(d)}
  const a=el('div','acts');
  if(it.uid){
    const e=S.events.find(x=>x.id===it.uid);
    const eb=el('button','mini','Edit'),xb=el('button','mini','Delete');
    eb.setAttribute('aria-label','Edit '+it.name);xb.setAttribute('aria-label','Delete '+it.name);
    eb.onclick=()=>openEv(e);
    xb.onclick=()=>{if(confirm('Delete '+it.name+'?')){S.events=S.events.filter(x=>x.id!==it.uid);save();renderCalendar()}};
    a.append(eb,xb);
  }else if(it.fid){
    if(dEdit===it.fid){
      const i=el('input');i.type='date';i.value=it.date;i.setAttribute('aria-label','Date for '+it.name);
      const sv=el('button','mini go','Save date'),cn=el('button','mini','Cancel');
      sv.onclick=()=>{if(!ISO.test(i.value)){toast('Pick a date first');return}S.evDate[it.fid]=i.value;dEdit=null;save();renderCalendar();refreshToday()};
      cn.onclick=()=>{dEdit=null;renderCalendar()};
      r.append(i);a.append(sv,cn);
      if(it.mine){const rv=el('button','mini',it.base?'Use the file date':'Clear date');rv.onclick=()=>{delete S.evDate[it.fid];dEdit=null;save();renderCalendar();refreshToday()};a.append(rv)}
    }else{
      const b=el('button','mini',it.date?'Change date':'Set date');b.setAttribute('aria-label',(it.date?'Change date of ':'Set date of ')+it.name);
      b.onclick=()=>{dEdit=it.fid;renderCalendar('#v-calendar input[type=date]')};a.append(b);
    }
  }else if(it.pid){
    const b=el('button','mini','Open project');b.onclick=()=>setView('projects');a.append(b);
  }
  if(a.childNodes.length)r.append(a);
  return r;
}
function openEv(e){
  ef=e?{id:e.id,name:e.name,type:e.type,date:e.date,end:e.end||'',note:e.note||''}
     :{id:null,name:'',type:'hackathon',date:(selDay&&selDay.slice(0,7)===calV.y+'-'+pad2(calV.m+1))?selDay:ymd(new Date()),end:'',note:''};
  renderCalendar();window.scrollTo(0,0);
}
function saveEv(){
  const f=ef;
  if(!f.name.trim()){toast('Give the event a name first');return}
  if(!ISO.test(f.date)){toast('Pick a start date');return}
  if(f.end&&(!ISO.test(f.end)||f.end<f.date)){toast('The end date is before the start date');return}
  let e=S.events.find(x=>x.id===f.id);
  if(!e){e={id:'e'+Date.now().toString(36)};S.events.push(e)}
  Object.assign(e,{name:f.name.trim(),type:f.type,date:f.date,end:f.end||'',note:f.note.trim()});
  const d=new Date(f.date+'T00:00:00');calV={y:d.getFullYear(),m:d.getMonth()};selDay=f.date;
  ef=null;save();renderCalendar();
}
function eventForm(){
  const f=ef,w=el('div','card');
  const inp=(label,key,type,ph)=>{const l=el('label',null,label),i=el(type==='area'?'textarea':'input');if(type!=='area')i.type=type||'text';else i.rows=3;i.value=f[key];if(ph)i.placeholder=ph;i.oninput=()=>{f[key]=i.value};l.append(i);w.append(l);return i};
  w.append(el('h3',null,f.id?'Edit event':'New event'));
  inp('Name','name','text','e.g. Hackathon at the college');
  const tl=el('label',null,'Type'),ts=el('select');for(const k of EV_USER){const o=el('option',null,EVT[k]);o.value=k;ts.append(o)}ts.value=f.type;ts.onchange=()=>{f.type=ts.value};tl.append(ts);w.append(tl);
  inp('Starts','date','date');inp('Ends (optional, for events over several days)','end','date');inp('Note (optional)','note','area');
  w.append(el('p','sub','Project deadlines appear here by themselves. Set them on the Projects tab.'));
  const row=el('div','prow'),sv=el('button','main','Save'),cn=el('button',null,'Cancel');sv.onclick=saveEv;cn.onclick=()=>{ef=null;renderCalendar()};row.append(sv,cn);w.append(row);
  return w;
}
function renderCalendar(foc){
  const v=$('v-calendar');v.textContent='';
  if(ef){v.append(eventForm());return}
  const items=calItems(),today=ymd(new Date()),{y,m}=calV,ym=y+'-'+pad2(m+1);
  const head=el('div','calh'),pv=el('button','mini','‹'),nx=el('button','mini','›'),td=el('button','mini','Today');
  pv.setAttribute('aria-label','Previous month');nx.setAttribute('aria-label','Next month');pv.dataset.nav='prev';nx.dataset.nav='next';
  pv.onclick=()=>{calV=m?{y,m:m-1}:{y:y-1,m:11};renderCalendar('[data-nav=prev]')};
  nx.onclick=()=>{calV=m<11?{y,m:m+1}:{y:y+1,m:0};renderCalendar('[data-nav=next]')};
  td.onclick=()=>{const n=new Date();calV={y:n.getFullYear(),m:n.getMonth()};selDay=today;renderCalendar()};
  head.append(pv,el('h2',null,new Date(y,m,1).toLocaleDateString(undefined,{month:'long',year:'numeric'})),td,nx);
  v.append(head);
  const g=el('div','cal-g');
  for(const d of ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'])g.append(el('div','cal-w',d));
  const first=(new Date(y,m,1).getDay()+6)%7,n=new Date(y,m+1,0).getDate();
  for(let i=0;i<first;i++)g.append(el('div'));
  for(let d=1;d<=n;d++){
    const ds=ym+'-'+pad2(d),on=onDay(items,ds),b=el('button','cd'+(ds===today?' today':''));
    b.type='button';b.dataset.d=ds;b.setAttribute('aria-pressed',String(ds===selDay));
    b.setAttribute('aria-label',fmt(ds,{weekday:'long',day:'numeric',month:'long'})+(on.length?', '+on.length+(on.length===1?' item':' items'):''));
    const dots=el('span','kds');for(const it of on.slice(0,3))dots.append(el('i','kd k-'+it.k));
    b.append(el('span','dn',String(d)),dots);
    b.onclick=()=>{selDay=ds;renderCalendar('.cd[data-d="'+ds+'"]')};
    g.append(b);
  }
  v.append(g);
  const kinds=[...new Set(items.filter(it=>it.date&&it.date.slice(0,7)<=ym&&ym<=endOf(it).slice(0,7)).map(it=>it.k))];
  if(kinds.length){const lg=el('div','legend');for(const k of kinds)lg.append(el('span','chip k-'+k,EVT[k]));v.append(lg)}
  const sel=el('section','proj');
  if(selDay&&selDay.slice(0,7)===ym){
    sel.append(el('h2',null,fmt(selDay,{weekday:'long',day:'numeric',month:'long'})));
    const on=onDay(items,selDay);
    if(on.length)for(const it of on)sel.append(calRow(it));else sel.append(el('p','muted','Nothing on this day.'));
  }else sel.append(el('p','muted','Tap a day to see what is on it.'));
  v.append(sel);
  const up=items.filter(it=>it.date&&daysTo(endOf(it))>=0).sort((a,b)=>a.date.localeCompare(b.date)||a.name.localeCompare(b.name));
  const ag=el('section','proj');ag.append(el('h2',null,'Coming up'));
  if(!up.length)ag.append(el('p','muted','Nothing coming up. Add an event, or give a project a deadline.'));
  for(const it of up.slice(0,20))ag.append(calRow(it));
  if(up.length>20)ag.append(el('p','muted note','and '+(up.length-20)+' more later'));
  v.append(ag);
  const nd=items.filter(it=>!it.date);
  if(nd.length){const s2=el('section','proj');s2.append(el('h2',null,'Needs a date'));for(const it of nd)s2.append(calRow(it));v.append(s2)}
  const add=el('button','main','Add an event');add.onclick=()=>openEv(null);v.append(add);
  if(foc){const t=v.querySelector(foc);if(t)t.focus({preventScroll:true})}
}

function renderAll(){renderHud();render();renderProjects();renderCalendar();renderPath();renderRoadmap();renderRewards()}
function setView(v){
  view=v;
  for(const b of document.querySelectorAll('.tabs button'))b.setAttribute('aria-selected',String(b.dataset.v===v));
  for(const id of ['today','projects','calendar','path','roadmap','rewards'])$('v-'+id).hidden=id!==v;
  window.scrollTo(0,0);
}
function setClock(left,total){
  const m=Math.floor(left/60),s=left%60,c=$('clock');if(c)c.textContent=m+':'+String(s).padStart(2,'0');
  const fg=$('fg');if(fg)fg.style.strokeDashoffset=String(276.46*(1-left/total));
}
function startTimer(total){
  stop();let left=total;
  $('go').textContent='Stop timer';$('go').onclick=()=>{stop();render()};
  timer=setInterval(()=>{left--;setClock(left,total);
    if(left<=0){stop();try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}
      $('go').textContent='Time is up. Log it below.';$('go').onclick=null}},1000);
}
function stop(){if(timer){clearInterval(timer);timer=null}}
function finish(kind){
  const {n,lad}=cur,ts=Date.now();
  S.log.push({id:n.id,lad:lad.id,title:n.t,ts,k:kind});
  S.last[lad.id]=ts;
  if(kind==='topic'){S.done[n.id]=ts;if(S.pin===n.id)S.pin=null}
  save();stop();
  const gain=kind==='topic'?XP.topic:kind==='tiny'?XP.tiny:XP.session;
  const before=Object.keys(S.badges).length,lv0=S.lvl;
  check(false);
  if(Object.keys(S.badges).length===before&&S.lvl===lv0)toast('+'+gain+' XP');
  renderAll();
}
for(const b of document.querySelectorAll('.tabs button'))b.onclick=()=>setView(b.dataset.v);
$('copy').onclick=async()=>{
  const lines=S.log.map(l=>'- '+new Date(l.ts).toISOString().slice(0,10)+' | '+l.lad+' | '+l.title+(l.k==='topic'?' (finished)':l.k==='tiny'?' (tiny step)':'')).join('\n');
  try{await navigator.clipboard.writeText(lines||'Nothing logged yet.');$('copy').textContent='Copied';setTimeout(()=>$('copy').textContent='Copy dev log',1500)}catch(e){prompt('Copy this:',lines)}
};
$('reset').onclick=()=>{if(confirm('Erase all progress on this device?')){S=blank();save();check(true);renderAll()}};
Promise.all(FILES.map(f=>fetch(f,{cache:'no-cache'}).then(r=>{if(!r.ok)throw new Error(f);return r.json()}))).then(([a,b,c])=>{
  D={ladders:a.ladders,projects:b.projects,events:c.events};
  return fetch('path.json',{cache:'no-cache'}).then(r=>r.ok?r.json():null).catch(()=>null).then(pj=>{P=pj;build();check(true);renderAll()});
}).catch(()=>{$('focus').innerHTML='<p class="msg">Could not load the plan files. Open this page from GitHub Pages or a local server, not as a file.</p>'});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>

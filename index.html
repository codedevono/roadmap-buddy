<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101a22">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<title>Roadmap Buddy</title>
<style>
:root{--bg:#eef2f4;--ink:#14202b;--mute:#5d6f7c;--line:#cfd9df;--accent:#1f6f78;--accent-ink:#fff;--track:#d9e3e8;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101a22;--ink:#e6edf1;--mute:#8fa2b0;--line:#2a3b49;--accent:#7cc4cc;--accent-ink:#0b1318;--track:#223240;color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
main{max-width:30rem;margin:0 auto;padding:1.25rem 1.25rem 2rem;display:flex;flex-direction:column;min-height:100%}
.top{display:flex;justify-content:space-between;align-items:baseline;color:var(--mute);font-size:.9rem}
.focus{flex:1;display:flex;flex-direction:column;justify-content:center;padding:2rem 0}
.track{color:var(--accent);font-weight:600;margin:0 0 .5rem}
h1{font:600 1.9rem/1.2 Georgia,"Iowan Old Style","Times New Roman",serif;margin:0 0 .75rem}
.hint{color:var(--mute);margin:0 0 1.5rem}
.ring{position:relative;width:11rem;height:11rem;margin:0 auto 1.5rem}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:10}
.ring .bg{stroke:var(--track)}
.ring .fg{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset 1s linear}
.ring .t{position:absolute;inset:0;display:grid;place-items:center;font:600 2rem system-ui,sans-serif;font-variant-numeric:tabular-nums}
button{font:inherit;color:var(--ink);background:transparent;border:1.5px solid var(--line);border-radius:.9rem;padding:.8rem 1rem;min-height:3rem;cursor:pointer}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button.main{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600;width:100%;font-size:1.1rem;min-height:3.4rem}
.row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.5rem;margin-top:.75rem}
.week{border-top:1px solid var(--line);padding-top:1rem}
.week h2{font-size:.95rem;font-weight:600;margin:0 0 .6rem}
.t-row{display:flex;align-items:center;gap:.75rem;padding:.25rem 0}
.t-row .n{width:6.5rem;font-size:.95rem}
.dots{display:flex;gap:.3rem}
.dot{width:.8rem;height:.8rem;border-radius:50%;border:1.5px solid var(--line)}
.dot.on{background:var(--accent);border-color:var(--accent)}
.foot{display:flex;gap:.5rem;margin-top:1.25rem}
.foot button{flex:1;font-size:.85rem;min-height:2.5rem;color:var(--mute)}
.msg{color:var(--mute);text-align:center;padding:1rem}
@media (prefers-reduced-motion:reduce){.ring .fg{transition:none}}
</style>
</head>
<body>
<main>
  <div class="top"><span id="date"></span><span id="count"></span></div>
  <section class="focus" id="focus" aria-live="polite"></section>
  <section class="week"><h2>This week</h2><div id="week"></div>
    <div class="foot"><button id="copy">Copy dev log</button><button id="reset">Reset data</button></div>
  </section>
</main>
<script>
const KEY='buddy.v1', DAY=864e5;
let R=null, S=load(), cur=null, timer=null;
function load(){try{return Object.assign({done:{},later:{},last:{},log:[]},JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){return{done:{},later:{},last:{},log:[]}}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const $=id=>document.getElementById(id);
function weekStart(){const x=new Date();x.setHours(0,0,0,0);x.setDate(x.getDate()-(x.getDay()+6)%7);return x.getTime()}
function weekCount(tid){const w=weekStart();return S.log.filter(l=>l.track===tid&&l.ts>=w).length}
function pick(){
  const now=Date.now();let best=null;
  for(const t of R.tracks){
    const task=t.tasks.find(k=>!S.done[k.id]&&!(S.later[k.id]>now));
    if(!task)continue;
    const gap=(t.perWeek-weekCount(t.id))/t.perWeek;
    const idle=Math.min((now-(S.last[t.id]||0))/DAY,7);
    const score=gap*10+idle*.5;
    if(!best||score>best.score)best={t,task,score};
  }
  return best;
}
function render(){
  $('date').textContent=new Date().toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'short'});
  const w=weekStart(), n=S.log.filter(l=>l.ts>=w).length;
  $('count').textContent=n+' done this week';
  const f=$('focus');f.textContent='';
  cur=pick();
  if(!cur){f.innerHTML='<p class="msg">Every task is done or snoozed. Add more tasks to roadmap.json or check back later.</p>';}
  else{
    const {t,task}=cur, tiny=!!cur.tiny, mins=tiny?5:task.min;
    f.innerHTML=`<p class="track"></p><h1></h1><p class="hint"></p>
    <div class="ring"><svg viewBox="0 0 100 100"><circle class="bg" cx="50" cy="50" r="44"/><circle class="fg" id="fg" cx="50" cy="50" r="44" stroke-dasharray="276.46" stroke-dashoffset="0"/></svg><div class="t" id="clock"></div></div>
    <button class="main" id="go">Start ${mins} minutes</button>
    <div class="row"><button id="ok">Done</button><button id="later">Later</button><button id="hard">Too hard</button></div>`;
    f.querySelector('.track').textContent=t.name;
    f.querySelector('h1').textContent=task.title;
    f.querySelector('.hint').textContent=tiny?'Tiny version: '+task.tiny:'Smallest start: '+task.tiny;
    setClock(mins*60,mins*60);
    $('go').onclick=()=>startTimer(mins*60);
    $('ok').onclick=()=>finish(false);
    $('later').onclick=()=>{S.later[task.id]=Date.now()+DAY;save();stop();render()};
    $('hard').onclick=()=>{stop();cur.tiny=true;S.tinyId=task.id;redrawTiny()};
  }
  const wk=$('week');wk.textContent='';
  for(const t of R.tracks){
    const c=weekCount(t.id),r=document.createElement('div');r.className='t-row';
    r.innerHTML='<span class="n"></span><span class="dots"></span>';
    r.querySelector('.n').textContent=t.name;
    const d=r.querySelector('.dots');
    for(let i=0;i<t.perWeek;i++){const s=document.createElement('span');s.className='dot'+(i<c?' on':'');d.appendChild(s)}
    wk.appendChild(r);
  }
}
function redrawTiny(){
  // re-render the same task in tiny mode (5 minutes, smallest step)
  const {t,task}=cur;const f=$('focus');
  f.querySelector('.hint').textContent='Tiny version: '+task.tiny;
  $('go').textContent='Start 5 minutes';$('go').onclick=()=>startTimer(300);
  setClock(300,300);
  $('ok').onclick=()=>finish(true);
}
function setClock(left,total){
  const m=Math.floor(left/60),s=left%60;
  const c=$('clock');if(c)c.textContent=m+':'+String(s).padStart(2,'0');
  const fg=$('fg');if(fg)fg.style.strokeDashoffset=String(276.46*(1-left/total));
}
function startTimer(total){
  stop();let left=total;
  $('go').textContent='Stop timer';$('go').onclick=()=>{stop();render()};
  timer=setInterval(()=>{
    left--;setClock(left,total);
    if(left<=0){stop();try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}
      $('go').textContent='Time is up. Mark it done below.';$('go').onclick=null}
  },1000);
}
function stop(){if(timer){clearInterval(timer);timer=null}}
function finish(tiny){
  const {t,task}=cur,ts=Date.now();
  S.log.push({id:task.id,track:t.id,title:task.title,ts,tiny:!!tiny});
  S.last[t.id]=ts;
  if(!tiny)S.done[task.id]=ts;
  save();stop();render();
}
$('copy').onclick=async()=>{
  const lines=S.log.map(l=>'- '+new Date(l.ts).toISOString().slice(0,10)+' | '+l.track+' | '+l.title+(l.tiny?' (tiny step)':'')).join('\n');
  try{await navigator.clipboard.writeText(lines||'Nothing logged yet.');$('copy').textContent='Copied';setTimeout(()=>$('copy').textContent='Copy dev log',1500)}catch(e){prompt('Copy this:',lines)}
};
$('reset').onclick=()=>{if(confirm('Erase all progress on this device?')){S={done:{},later:{},last:{},log:[]};save();render()}};
fetch('roadmap.json').then(r=>r.json()).then(j=>{R=j;render()}).catch(()=>{$('focus').innerHTML='<p class="msg">Could not load roadmap.json. Open this page from GitHub Pages or a local server, not as a file.</p>'});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
